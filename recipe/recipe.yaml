context:
  version: "1.27.2"

recipe:
  name: openmodelica
  version: ${{ version }}

source:
  url: https://github.com/OpenModelica/OpenModelica/releases/download/v${{ version }}/OpenModelica-v${{ version }}-src-with-submodules.zip
  sha256: b724e7deba511d888c29f7e150abb2865522cdf9bb39d2ed84c653cbdffd20e6
  patches:
    # drop erroneous _GNU_SOURCE define (error seems specific to conda-forge)
    - fmilib-gnusource.patch
    # Add OM_USE_SYSTEM_ZLIB option to fix stdio.h:210:7: error: expected identifier or '(' (updated to zlib 1.3.2 upstream)
    - zlib.patch
    # add macos/aarch64 platforms (https://github.com/robbr48/fmi4c/pull/97)
    - fmi4c.patch
    # boost includes (https://github.com/OpenModelica/OpenModelica/pull/15982)
    - boost.patch
    # SyntaxError (https://github.com/OpenModelica/OpenModelica/pull/15983)
    - syntaxerror.patch
    # error: no member named 'random_shuffle' in namespace 'std' (https://github.com/OpenModelica/OMCompiler-3rdParty/pull/219)
    - random_shuffle.patch
    # ld: unknown option: --no-undefined (https://github.com/OpenModelica/OpenModelica/pull/15990)
    - undefined.patch
    # cc1: error: '-Werror=c23-extensions': no option '-Wc23-extensions (https://github.com/OpenModelica/OpenModelica/pull/16297)
    - 0001-SimRT-C-Mismatching-clang-flags.patch

build:
  number: 1
  skip:
    - win

outputs:
  # Build once here, then split the install tree into the packages below.
  # This avoids building twice (https://github.com/conda-forge/openmodelica-feedstock/issues/23).
  - staging:
      name: openmodelica-build
    requirements:
      build:
        - cmake
        - ninja
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('fortran') }}
        - if: unix
          then:
            - pkg-config
            - autoconf
            - automake
            - make
      host:
        - openjdk
        - libblas
        - liblapack
        - libcurl
        - libboost-devel
        - libffi
        - libiconv
        - readline
        - qt-webengine
        - openscenegraph
        - if: linux
          then:
            - libgl-devel
            - libegl-devel
        - if: osx
          then:
            - libintl
    build:
      script:
        file: build.sh

  # Compiler-only install: omc, OMSimulator and the simulation runtimes,
  # without the Qt GUI clients or java.
  - package:
      name: openmodelica-omc
    inherit: openmodelica-build
    build:
      files:
        include:
          - bin/**
          - doc/**
          - etc/**
          - include/**
          - lib/**
          - share/**
        exclude:
          # Qt GUI clients and their private libs/data (shipped in `openmodelica`)
          - bin/OMEdit
          - bin/OMNotebook
          - bin/OMPlot
          - bin/OMShell
          - lib/omc/libOMPlotLib.so
          - lib/omc/libomqwt.so*
          - lib/omc/libomsensplugin.so
          - share/omedit/**
          - share/omnotebook/**
          - share/omshell/**
    requirements:
      run:
        - cmake
        - make
        - zip
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
      # run exports are inherited from staging; drop the pins that only the
      # excluded GUI files above link against (verified with readelf: only
      # OMEdit/OMNotebook/OMPlot/OMShell plus libOMPlotLib/libomqwt/
      # libomsensplugin need Qt / OpenSceneGraph).
      ignore_run_exports:
        by_name:
          - qt-webengine
          - openscenegraph
          - libgl
          - libegl
      run_constraints:
        - omcompiler <0
    tests:
      - script:
          - omc --version
          - OMSimulator --help
          - echo 'loadFile("OMCompiler/Examples/Circle.mo"); getErrorString(); buildModelFMU(Circle); getErrorString();' > export.mos
          - omc export.mos
          - ls Circle.fmu
          - OMSimulator Circle.fmu
          - echo 'loadFile("OMCompiler/Examples/Circle.mo"); getErrorString(); buildModelFMU(Circle, platforms={"dynamic"}); getErrorString();' > export.mos
          - omc --fmuCMakeBuild=true --fmuRuntimeDepends=modelica export.mos
          - ls Circle.fmu
          - OMSimulator Circle.fmu
        files:
          source:
            - OMCompiler/Examples/Circle.mo

  # Full install: the Qt GUI clients on top of openmodelica-omc.
  # `install openmodelica` resolves to the same files in the same prefix as before.
  - package:
      name: openmodelica
    inherit: openmodelica-build
    build:
      files:
        - bin/OMEdit
        - bin/OMNotebook
        - bin/OMPlot
        - bin/OMShell
        - lib/omc/libOMPlotLib.so
        - lib/omc/libomqwt.so*
        - lib/omc/libomsensplugin.so
        - share/omedit/**
        - share/omnotebook/**
        - share/omshell/**
    requirements:
      run:
        - ${{ pin_subpackage('openmodelica-omc', exact=True) }}
        - openjdk
        - qt-webengine
        - openscenegraph
      run_constraints:
        - omcompiler <0
    tests:
      - script:
          - OMEdit --help

about:
  homepage: https://openmodelica.org/
  license: LicenseRef-OSMC-PL
  license_family: GPL
  license_file:
    - OSMC-License.txt
    - OMCompiler/3rdParty/antlr/3.2/libantlr3c-3.2/COPYING
    - OMCompiler/3rdParty/Cdaskr/LICENSE
    - OMCompiler/3rdParty/CMinpack/CopyrightMINPACK.txt
    - OMCompiler/3rdParty/gc/README.md
    - OMCompiler/3rdParty/FMIL/LICENSE.md
    - OMCompiler/3rdParty/libffi/LICENSE
    - OMCompiler/3rdParty/libzmq/COPYING.LESSER
    - OMCompiler/3rdParty/lis-1.4.12/COPYING
    - OMCompiler/3rdParty/metis-5.1.0/LICENSE.txt
    - OMCompiler/3rdParty/moo-0.1.0/COPYING.LESSER
    - OMCompiler/3rdParty/open62541/open62541.txt
    - OMCompiler/3rdParty/primme-3.2.3/COPYING.txt
    - OMCompiler/3rdParty/ryu/LICENSE-Apache2
    - OMCompiler/3rdParty/SuiteSparse-5.8.1/LICENSE.txt
    - OMCompiler/3rdParty/sundials-5.4.0/LICENSE
    - OMCompiler/3rdParty/zlib/LICENSE
  summary: The Open Source Modelica Suite

extra:
  recipe-maintainers:
    - jschueller
